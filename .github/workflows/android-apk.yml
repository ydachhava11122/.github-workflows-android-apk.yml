
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract AAKNOVA Project
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          test -n "$ZIP" || exit 1
          unzip -q "$ZIP" -d extracted
          PACKAGE=$(find extracted -name package.json | head -n 1)
          test -n "$PACKAGE" || exit 1
          echo "PROJECT_DIR=$(dirname "$PACKAGE")" >> $GITHUB_ENV

      - name: Install and Build
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npm run build
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          test -f gradlew || exit 1
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          
