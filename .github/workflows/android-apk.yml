
name: AAKNOVA - Complete Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build AAKNOVA Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Automatically accept Android SDK licenses.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Extract and Locate AAKNOVA Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          if [ -f "package.json" ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f \
              -iname '*.zip' -not -path './.git/*' | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No project ZIP or root package.json found."
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted

            PACKAGE_FILE=$(find extracted -type f \
              -name package.json \
              -not -path '*/node_modules/*' | head -n 1)

            if [ -z "$PACKAGE_FILE" ]; then
              echo "ERROR: package.json not found in ZIP."
              exit 1
            fi

            PROJECT="$(dirname "$PACKAGE_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project located: $PROJECT"

      - name: Install Project Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify Capacitor Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.json ]; then
            echo "ERROR: Capacitor configuration is missing."
            exit 1
          fi

          CORE_VERSION=$(node -e "
            const p=require('./package.json');
            console.log(
              p.dependencies?.['@capacitor/core'] ||
              p.devDependencies?.['@capacitor/core'] || ''
            );
          ")

          if [ -z "$CORE_VERSION" ]; then
            echo "ERROR: @capacitor/core is missing."
            exit 1
          fi

          CORE_MAJOR=$(echo "$CORE_VERSION" | grep -oE '[0-9]+' | head -n 1)

          if [ -z "$CORE_MAJOR" ]; then
            echo "ERROR: Cannot determine Capacitor version."
            exit 1
          fi

          if ! npm ls @capacitor/android --depth=0 >/dev/null 2>&1; then
            npm install "@capacitor/android@$CORE_MAJOR"
          fi

          if ! npm ls @capacitor/cli --depth=0 >/dev/null 2>&1; then
            npm install --save-dev "@capacitor/cli@$CORE_MAJOR"
          fi

          echo "Capacitor dependency verification complete."

      - name: Build Web Application
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npm run build

          if [ ! -d dist ]; then
            echo "ERROR: Vite dist folder was not generated."
            exit 1
          fi

      - name: Prepare Android Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle wrapper is missing."
            exit 1
          fi

          npx cap sync android

      - name: Verify Android Build Environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          node --version
          npm --version
          sdkmanager --version

          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/AAKNOVA.apk"

          echo "AAKNOVA APK BUILD SUCCESSFUL"

      - name: Upload AAKNOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: output/AAKNOVA.apk
          if-no-files-found: error
          retention-days: 14
          
          
          
          
          
          
          
          
          
          
          
          
          
