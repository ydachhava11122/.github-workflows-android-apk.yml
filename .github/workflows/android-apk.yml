
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build AAKNOVA Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          test -d "$SDK_ROOT/platforms/android-34"
          test -x "$SDK_ROOT/build-tools/34.0.0/apksigner"

          echo "Android SDK ready"

      - name: Find and extract AAKNOVA ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t ROOT_ZIPS < <(
            find . -maxdepth 3 -type f -iname '*.zip' \
              ! -path './.git/*' \
              ! -path './extracted/*' | sort
          )

          if [ "${#ROOT_ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Exactly one project ZIP is required."
            printf '%s\n' "${ROOT_ZIPS[@]}"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -oq "${ROOT_ZIPS[0]}" -d extracted

          PROJECT_DIR=""

          for depth in 1 2 3; do

            mapfile -t PROJECTS < <(
              find extracted -type f -name package.json \
                ! -path '*/node_modules/*' \
                ! -path '*/android/*' | sort
            )

            if [ "${#PROJECTS[@]}" -eq 1 ]; then
              PROJECT_DIR="$(dirname "${PROJECTS[0]}")"
              break
            fi

            if [ "${#PROJECTS[@]}" -gt 1 ]; then
              echo "ERROR: Multiple projects found."
              printf '%s\n' "${PROJECTS[@]}"
              exit 1
            fi

            mapfile -t NESTED_ZIPS < <(
              find extracted -type f -iname '*.zip' \
                ! -path '*/node_modules/*' | sort
            )

            if [ "${#NESTED_ZIPS[@]}" -eq 0 ]; then
              echo "ERROR: No project package.json found."
              find extracted -maxdepth 5 -type f | head -200
              exit 1
            fi

            for archive in "${NESTED_ZIPS[@]}"; do
              destination="extracted/unpacked-${depth}-$(basename "${archive%.zip}")"
              mkdir -p "$destination"
              unzip -oq "$archive" -d "$destination"
            done
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project directory not found."
            exit 1
          fi

          test -s "$PROJECT_DIR/package.json"
          test -s "$PROJECT_DIR/vite.config.ts"
          test -s "$PROJECT_DIR/src/main.tsx"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          if (!pkg.scripts?.build) {
            throw new Error('Missing scripts.build');
          }

          if (!pkg.dependencies?.react ||
              !pkg.dependencies?.['react-dom']) {
            throw new Error('React dependencies missing');
          }

          if (!pkg.dependencies?.vite ||
              !pkg.dependencies?.['@vitejs/plugin-react']) {
            throw new Error('Vite dependencies missing');
          }

          console.log('Project validation passed');
          NODE

      - name: Install project dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install Capacitor dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          npm install --save-exact \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            @capacitor/core@6.2.1 \
            @capacitor/cli@6.2.1 \
            @capacitor/android@6.2.1

      # FIX: Recharts requires react-is.
      # Install the matching React major version.
      - name: Fix Recharts react-is dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          REACT_VERSION="$(node -p "require('./node_modules/react/package.json').version")"
          REACT_MAJOR="${REACT_VERSION%%.*}"

          echo "Detected React version: $REACT_VERSION"
          echo "Detected React major: $REACT_MAJOR"

          npm install \
            --no-save \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            "react-is@^${REACT_MAJOR}.0.0"

          node -e "console.log('react-is:', require.resolve('react-is'))"

          node -e "console.log('react-is version:', require('react-is/package.json').version)"

      - name: Verify toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          node --version
          npm --version
          java -version

          cd "$PROJECT_DIR"

          test "$(node -p "require('./node_modules/@capacitor/core/package.json').version")" = '6.2.1'

          test "$(node -p "require('./node_modules/@capacitor/cli/package.json').version")" = '6.2.1'

          test "$(node -p "require('./node_modules/@capacitor/android/package.json').version")" = '6.2.1'

          test -n "$(node -p "require.resolve('react-is')")"

      - name: Configure Capacitor JSON
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [ -f capacitor.config.ts ]; then
            mv capacitor.config.ts capacitor.config.ts.source-backup
          fi

          rm -f capacitor.config.js
          rm -f capacitor.config.mjs
          rm -f capacitor.config.cjs

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.aaknova.app",
            "appName": "AAKNOVA",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          JSON

          node -e "JSON.parse(require('node:fs').readFileSync('capacitor.config.json','utf8'))"

          npx cap --version

      - name: Build web application
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          npm run build

          test -s dist/index.html

          echo "Web application build successful"

      - name: Generate Android project
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [ -d android ]; then
            rm -rf android-uploaded
            mv android android-uploaded
          fi

          npx cap add android

          test -s android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/app/build.gradle

          chmod +x android/gradlew

      - name: Configure AAKNOVA Package ID
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"

          node <<'NODE'
          const fs = require('fs');

          const file = 'app/build.gradle';
          let gradle = fs.readFileSync(file, 'utf8');

          const packageId = 'com.aaknova.app';

          if (/namespace\s+['"][^'"]+['"]/.test(gradle)) {
            gradle = gradle.replace(
              /namespace\s+['"][^'"]+['"]/,
              `namespace '${packageId}'`
            );
          } else {
            gradle = gradle.replace(
              /android\s*\{/,
              `android {\n    namespace '${packageId}'`
            );
          }

          if (/applicationId\s+['"][^'"]+['"]/.test(gradle)) {
            gradle = gradle.replace(
              /applicationId\s+['"][^'"]+['"]/,
              `applicationId '${packageId}'`
            );
          } else {
            gradle = gradle.replace(
              /defaultConfig\s*\{/,
              `defaultConfig {\n        applicationId '${packageId}'`
            );
          }

          if (!/namespace\s+['"]com\.aaknova\.app['"]/.test(gradle)) {
            throw new Error('Namespace configuration failed');
          }

          if (!/applicationId\s+['"]com\.aaknova\.app['"]/.test(gradle)) {
            throw new Error('Application ID configuration failed');
          }

          fs.writeFileSync(file, gradle);

          console.log('AAKNOVA Package ID configured');
          NODE

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          npx cap sync android

          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/capacitor.build.gradle

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"

          java -version

          ./gradlew --no-daemon --version

          ./gradlew --no-daemon --version | grep -q 'JVM:.*17'

      - name: Build and verify Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify --verbose "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/AAKNOVA.apk"

          test -s "$GITHUB_WORKSPACE/output/AAKNOVA.apk"

          ls -lh "$GITHUB_WORKSPACE/output/AAKNOVA.apk"

      - name: Upload AAKNOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: output/AAKNOVA.apk
          if-no-files-found: error
          retention-days: 14
          
