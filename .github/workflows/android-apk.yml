
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Install Dependencies
        run: |
          cd extracted
          npm install --legacy-peer-deps
          npm install react-is --save --legacy-peer-deps

      - name: Build Website
        run: |
          cd extracted
          npm run build

      - name: Install Capacitor Android
        run: |
          cd extracted
          npm install @capacitor/cli --save-dev --legacy-peer-deps
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          echo "Capacitor Core version: $CAP_VERSION"
          npm install "@capacitor/android@$CAP_VERSION" --save --legacy-peer-deps

      - name: Sync Android
        run: |
          cd extracted
          npx --no-install cap sync android

      - name: Accept Android Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate Gradle Wrapper
        run: |
          cd extracted/android
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew

      - name: Build APK
        run: |
          cd extracted/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: extracted/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
          
          
          
          
          
          
          
