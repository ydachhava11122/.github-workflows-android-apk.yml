
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Find and Extract ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted
          else
            echo "No ZIP found, checking repository files"
          fi

      - name: Locate Android Project
        run: |
          PROJECT_DIR=""

          for ROOT in . extracted; do
            FOUND=$(find "$ROOT" -type f -name gradlew -printf '%h\n' 2>/dev/null | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$FOUND"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find . -type f -name capacitor.settings.gradle -printf '%h\n' 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$FOUND"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            echo "Repository files:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
          
          
          
          
