
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Repository root mein ZIP file nahi mili."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted" >> "$GITHUB_ENV"

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --save-dev esbuild@^0.28.2

      - name: Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Install Capacitor Android
        run: |
          cd "$PROJECT_DIR"
          npm install @capacitor/android

      - name: Sync Capacitor Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: extracted/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
          
          
          
          
          
          
          
          
          
          
          
