
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build AAKNOVA APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 4 -type f -iname '*.zip' \
              ! -path './.git/*' | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Multiple ZIP files found."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "${ZIP_FILES[0]}" -d extracted

          mapfile -t PROJECTS < <(
            find extracted -type f -name package.json \
              ! -path '*/node_modules/*' \
              ! -path '*/android/*' | sort
          )

          if [ "${#PROJECTS[@]}" -ne 1 ]; then
            echo "ERROR: Expected one React project."
            printf '%s\n' "${PROJECTS[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PROJECTS[0]}")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npm install --legacy-peer-deps

          npm install react-is --save --legacy-peer-deps

          npm install typescript@5.7.3 --save-dev --legacy-peer-deps

          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Verify project dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node -e "
            const p = require('./package.json');

            if (!p.scripts || !p.scripts.build) {
              console.error('ERROR: Build script missing.');
              process.exit(1);
            }
          "

          npm ls react-is typescript
          npm ls @capacitor/core @capacitor/cli @capacitor/android

      - name: Build React application
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npm run build

          if [ ! -d dist ]; then
            echo "ERROR: Vite dist folder not found."
            exit 1
          fi

      - name: Fix Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.mjs
          rm -f capacitor.config.cjs

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aaknova.app",
            "appName": "AAKNOVA",
            "webDir": "dist"
          }
          EOF

          cat capacitor.config.json

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -d android ] && {
            [ ! -f android/gradlew ] ||
            [ ! -f android/gradle/wrapper/gradle-wrapper.jar ];
          }; then
            echo "Incomplete Android wrapper. Regenerating platform."
            rm -rf android
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

          test -d android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper missing."
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: Gradle wrapper JAR missing."
            exit 1
          fi

          chmod +x gradlew

          java -version
          ./gradlew --version

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            find "$PROJECT_DIR/android" -type f -name '*.apk'
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/AAKNOVA.apk

          echo "APK successfully created."
          ls -lh output/AAKNOVA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: output/AAKNOVA.apk
          if-no-files-found: error
          retention-days: 7

          
