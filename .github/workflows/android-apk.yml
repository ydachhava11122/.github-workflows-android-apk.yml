name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build AAKNOVA Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Capacitor 6 / Android Gradle Plugin 8.2.1 requires JDK 17.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install command-line tools only. License acceptance is handled in the
      # next step so sdkmanager never waits for interactive input inside this action.
      - name: Set up pinned Android SDK command-line tools 22.0
        uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: ''
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses and install required packages
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Android SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-not-set}}"
          command -v sdkmanager
          # Feed every license prompt a 'yes' without requiring a person at the terminal.
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0'
          sdkmanager --list_installed
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT/platforms/android-34"
          test -x "$SDK_ROOT/build-tools/34.0.0/apksigner"

      - name: Find and extract the AAKNOVA project ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t ROOT_ZIPS < <(
            find . -maxdepth 3 -type f -iname '*.zip' \
              ! -path './.git/*' \
              ! -path './extracted/*' | sort
          )

          if [ "${#ROOT_ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Repository must contain exactly one top-level project ZIP."
            printf 'Found: %s\n' "${ROOT_ZIPS[@]}"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -oq "${ROOT_ZIPS[0]}" -d extracted

          PROJECT_DIR=''
          for depth in 1 2 3; do
            mapfile -t PROJECTS < <(
              find extracted -type f -name package.json \
                ! -path '*/node_modules/*' \
                ! -path '*/android/*' | sort
            )

            if [ "${#PROJECTS[@]}" -eq 1 ]; then
              PROJECT_DIR="$(dirname "${PROJECTS[0]}")"
              break
            fi

            if [ "${#PROJECTS[@]}" -gt 1 ]; then
              echo "ERROR: More than one React project was found in the ZIP files."
              printf '%s\n' "${PROJECTS[@]}"
              exit 1
            fi

            mapfile -t NESTED_ZIPS < <(
              find extracted -type f -iname '*.zip' \
                ! -path '*/node_modules/*' | sort
            )

            if [ "${#NESTED_ZIPS[@]}" -eq 0 ]; then
              echo "ERROR: No package.json or nested project ZIP was found."
              find extracted -maxdepth 5 -type f | sort | head -200
              exit 1
            fi

            for archive in "${NESTED_ZIPS[@]}"; do
              destination="extracted/unpacked-${depth}-$(basename "${archive%.zip}")"
              mkdir -p "$destination"
              unzip -oq "$archive" -d "$destination"
            done
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate the AAKNOVA project after extracting nested ZIP files."
            exit 1
          fi

          test -s "$PROJECT_DIR/package.json"
          test -s "$PROJECT_DIR/vite.config.ts"
          test -s "$PROJECT_DIR/src/main.tsx"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "AAKNOVA project found: $PROJECT_DIR"

      - name: Validate package manifest and install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!pkg.scripts?.build) throw new Error('package.json is missing scripts.build');
          if (!pkg.dependencies?.react || !pkg.dependencies?.['react-dom']) {
            throw new Error('React or React DOM dependency is missing');
          }
          if (!pkg.dependencies?.vite || !pkg.dependencies?.['@vitejs/plugin-react']) {
            throw new Error('Vite or @vitejs/plugin-react dependency is missing');
          }
          console.log('package.json validation passed');
          NODE

          # This source archive has bun.lock but no package-lock.json.
          # npm install (not npm ci) is therefore intentional.
          npm install --no-audit --no-fund --legacy-peer-deps

          # Pin all Capacitor packages to the same 6.2.1 release and install
          # Recharts' React 19-compatible peer dependency explicitly.
          npm install --save-exact --legacy-peer-deps --no-audit --no-fund \
            @capacitor/core@6.2.1 \
            @capacitor/cli@6.2.1 \
            @capacitor/android@6.2.1 \
            react-is@19.3.1

      - name: Verify toolchain versions
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          java -version
          node -e "const p=require('./$PROJECT_DIR/package.json'); for (const n of ['@capacitor/core','@capacitor/cli','@capacitor/android']) console.log(n + ': ' + p.dependencies[n]);"
          test "$(node -p "require('./$PROJECT_DIR/node_modules/@capacitor/core/package.json').version")" = '6.2.1'
          test "$(node -p "require('./$PROJECT_DIR/node_modules/@capacitor/cli/package.json').version")" = '6.2.1'
          test "$(node -p "require('./$PROJECT_DIR/node_modules/@capacitor/android/package.json').version")" = '6.2.1'

      - name: Configure Capacitor without TypeScript config parsing
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          # The supplied capacitor.config.ts caused a TypeScript loader error in CI.
          # Keep a backup in the extracted workspace and use a plain JSON config.
          if [ -f capacitor.config.ts ]; then
            mv capacitor.config.ts capacitor.config.ts.source-backup
          fi
          rm -f capacitor.config.js capacitor.config.mjs capacitor.config.cjs

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.aaknova.enterprise",
            "appName": "AAKNOVA",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          JSON

          node -e "JSON.parse(require('node:fs').readFileSync('capacitor.config.json','utf8')); console.log('Capacitor JSON config is valid');"
          npx cap --version

      - name: Build web application
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          npm run build
          test -s dist/index.html
          echo "Web build output verified: dist/index.html"

      - name: Generate a clean Capacitor Android project and restore app resources
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          # The uploaded android/ directory is incomplete: it has no Gradle
          # wrapper, wrapper JAR, or Capacitor-generated Gradle settings files.
          # Preserve its app source/resources, but regenerate all Gradle files
          # from the pinned Capacitor 6.2.1 template.
          if [ -d android ]; then
            rm -rf android-uploaded
            mv android android-uploaded
          fi

          npx cap add android

          if [ -d android-uploaded/app/src/main ]; then
            # Capacitor's fresh template may contain drawable/splash.png,
            # while the supplied app contains drawable/splash.xml. Android
            # treats both as the same drawable resource name and fails with
            # "Duplicate resources". Prefer the supplied branded XML splash.
            if [ -f android-uploaded/app/src/main/res/drawable/splash.xml ] \
              && [ -f android/app/src/main/res/drawable/splash.png ]; then
              rm -f android/app/src/main/res/drawable/splash.png
              echo 'Removed generated splash.png; keeping supplied splash.xml.'
            fi

            cp -a android-uploaded/app/src/main/. android/app/src/main/
          fi

          npx cap sync android

          test -s android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/capacitor.settings.gradle
          test -s android/app/capacitor.build.gradle
          test -s android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew

      - name: Verify Capacitor Android Gradle matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"

          AGP_VERSION="$(grep -Eo 'com\.android\.tools\.build:gradle:[0-9.]+' build.gradle | head -n 1 | awk -F: '{print $3}')"
          GRADLE_URL="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2-)"
          COMPILE_SDK="$(grep -Eo 'compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+' variables.gradle | head -n 1 | grep -Eo '[0-9]+$')"

          echo "Capacitor: 6.2.1"
          echo "Android Gradle Plugin: ${AGP_VERSION:-NOT FOUND}"
          echo "Gradle distribution: ${GRADLE_URL:-NOT FOUND}"
          echo "Compile SDK: ${COMPILE_SDK:-NOT FOUND}"

          test "$AGP_VERSION" = '8.2.1'
          [[ "$GRADLE_URL" == *'gradle-8.2.1-'* ]]
          test "$COMPILE_SDK" = '34'
          echo 'AGP 8.2.1 / Gradle 8.2.1 / compileSdk 34 checks passed.'
          echo 'Java 17 is verified separately using the actual Gradle runtime in the next step.'

      - name: Verify Java and Gradle runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"
          java -version
          ./gradlew --version
          ./gradlew --no-daemon --version | grep -q 'JVM:.*17'

      - name: Build and verify Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"
          ./gradlew --no-daemon --stacktrace clean assembleDebug

          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/AAKNOVA.apk"
          test -s "$GITHUB_WORKSPACE/output/AAKNOVA.apk"
          ls -lh "$GITHUB_WORKSPACE/output/AAKNOVA.apk"

      - name: Upload AAKNOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: output/AAKNOVA.apk
          if-no-files-found: error
          retention-days: 14
          
