
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android Project
        run: |
          PROJECT_DIR=$(find extracted -type f -name gradlew -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
          
          
          
          
          
          
