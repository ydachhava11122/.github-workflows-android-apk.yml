
name: AAKNOVA Complete Diagnostic and APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  diagnose-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Extract AAKNOVA ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP FOUND: $ZIP_FILE"
            mkdir -p "$RUNNER_TEMP/aaknova"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/aaknova"
            PROJECT_DIR="$RUNNER_TEMP/aaknova"
          elif [ -f "package.json" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            echo "ERROR: AAKNOVA ZIP or package.json missing"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Complete Project Structure Check
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          for FILE in \
            package.json \
            capacitor.config.ts \
            vite.config.ts \
            src/main.tsx \
            src/App.tsx \
            android/settings.gradle \
            android/build.gradle \
            android/app/build.gradle \
            android/variables.gradle \
            android/app/src/main/AndroidManifest.xml
          do
            if [ -f "$FILE" ]; then
              echo "[PASS] $FILE"
            else
              echo "[FAIL] Missing: $FILE"
              exit 1
            fi
          done

          if [ -f package-lock.json ]; then
            echo "[INFO] package-lock.json found"
          else
            echo "[INFO] No lock file; npm install will be used"
          fi

          if [ -f android/gradlew ]; then
            echo "[INFO] Gradle wrapper found"
          else
            echo "[INFO] Gradle wrapper will be generated"
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK and Accept Licenses
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Build Environment
        run: |
          java -version
          node --version
          npm --version
          sdkmanager --version

      - name: Install Project Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npm install --no-audit --no-fund

          npm install --no-save --no-audit --no-fund \
            @capacitor/core@^6 \
            @capacitor/cli@^6 \
            @capacitor/android@^6

      - name: Validate Capacitor
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npx cap --version
          npx cap doctor || true

      - name: Build Web Application
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npm run build

          test -s dist/index.html
          echo "[PASS] Vite production build completed"

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npx cap sync android

          test -f android/capacitor.settings.gradle
          test -f android/capacitor.build.gradle

          echo "[PASS] Capacitor Android sync completed"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Missing Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          if [ ! -f gradlew ]; then
            gradle wrapper \
              --gradle-version 8.7 \
              --distribution-type bin
          fi

          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "[PASS] Gradle wrapper ready"

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          ./gradlew assembleDebug --no-daemon

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "[FAIL] APK was not generated"
            exit 1
          fi

          echo "[PASS] AAKNOVA APK GENERATED"
          ls -lh "$APK"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" verify "$APK"

          echo "[PASS] APK signature verified"

      - name: Upload AAKNOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Final Build Report
        if: always()
        run: |
          echo "AAKNOVA BUILD WORKFLOW FINISHED"
          echo "Check the previous steps for PASS or FAIL."
          
          
          
          
          
          
          
          
          
          
          
          
