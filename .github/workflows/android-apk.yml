
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Find and Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found!"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Project
        run: |
          cd extracted

          PROJECT_DIR=$(find . -name package.json \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Verify Capacitor
        run: |
          cd "$PROJECT_DIR"
          npm install @capacitor/core @capacitor/android
          node -e "console.log(require('./node_modules/@capacitor/core/package.json').version)"

      - name: Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Prepare Android Project
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
          
          
          
          
          
          
