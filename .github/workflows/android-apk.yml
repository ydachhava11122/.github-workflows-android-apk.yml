
name: AAKNOVA Complete Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            mkdir -p "$RUNNER_TEMP/aaknova"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/aaknova"
            PROJECT_DIR="$RUNNER_TEMP/aaknova"
            echo "ZIP FOUND: $ZIP_FILE"
          elif [ -f package.json ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Project Files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          for FILE in \
            package.json \
            capacitor.config.ts \
            vite.config.ts \
            src/main.tsx \
            src/App.tsx \
            android/settings.gradle \
            android/build.gradle \
            android/app/build.gradle \
            android/variables.gradle \
            android/app/src/main/AndroidManifest.xml
          do
            if [ ! -f "$FILE" ]; then
              echo "MISSING: $FILE"
              exit 1
            fi
            echo "[PASS] $FILE"
          done

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Fix Dependency Versions
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          p.devDependencies = p.devDependencies || {};
          p.devDependencies.esbuild = '0.28.2';
          p.devDependencies.typescript = '5.9.3';

          fs.writeFileSync(
            'package.json',
            JSON.stringify(p, null, 2) + '\n'
          );
          NODE

          echo "[PASS] esbuild and TypeScript versions fixed"

      - name: Install Project Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npm install --no-audit --no-fund

          npm install --no-save --no-audit --no-fund \
            @capacitor/core@^6 \
            @capacitor/cli@^6 \
            @capacitor/android@^6

          echo "Checking versions..."
          node -e "
            console.log('TypeScript:', require('typescript').version);
            console.log('esbuild:', require('esbuild').version);
          "

          npm ls vite esbuild typescript \
            @capacitor/core @capacitor/cli @capacitor/android

      - name: Replace TypeScript Capacitor Config With JSON
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f capacitor.config.ts ]; then
            mv capacitor.config.ts capacitor.config.ts.backup
          fi

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aaknova.enterprise",
            "appName": "AAKNOVA",
            "webDir": "dist"
          }
          EOF

          echo "Checking JSON configuration..."
          node -e "
            const c = require('./capacitor.config.json');
            if (
              c.appId !== 'com.aaknova.enterprise' ||
              c.appName !== 'AAKNOVA' ||
              c.webDir !== 'dist'
            ) {
              throw new Error('Invalid Capacitor configuration');
            }
            console.log(c);
          "

          echo "[PASS] JSON Capacitor configuration ready"

      - name: Validate Capacitor
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npx cap --version
          npx cap doctor

      - name: Build Web Application
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npm run build

          test -s dist/index.html
          echo "[PASS] Web application build completed"

      - name: Sync Android Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npx cap sync android

          test -f android/capacitor.settings.gradle
          test -f android/capacitor.build.gradle

          echo "[PASS] Capacitor Android sync completed"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          if [ ! -f gradlew ]; then
            gradle wrapper \
              --gradle-version 8.7 \
              --distribution-type bin
          fi

          chmod +x gradlew

          test -f gradle/wrapper/gradle-wrapper.properties

          echo "[PASS] Gradle wrapper ready"

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          ./gradlew assembleDebug --no-daemon

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK NOT GENERATED"
            exit 1
          fi

          echo "[PASS] APK GENERATED"
          ls -lh "$APK"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -n 1)

          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"

          echo "[PASS] APK signature verified"

      - name: Upload AAKNOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Report
        if: always()
        run: |
          echo "================================"
          echo "AAKNOVA ANDROID BUILD REPORT"
          echo "================================"
          echo "Check previous steps for PASS or FAIL."
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
