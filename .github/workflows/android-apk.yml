
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          echo "ZIP extracted successfully"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Project
        run: |
          PACKAGE=$(find extracted -name package.json | head -n 1)
          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json missing from ZIP"
            echo "Your ZIP may contain a different project format."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"
          
          
