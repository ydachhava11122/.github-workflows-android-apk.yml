
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Project
        run: |
          echo "ZIP CONTENTS:"
          find extracted -maxdepth 4 -type f | head -100

          if find extracted -name capacitor.config.json -o -name capacitor.config.ts | grep -q .; then
            CONFIG=$(find extracted -name capacitor.config.json -o -name capacitor.config.ts | head -1)
            PROJECT_DIR=$(dirname "$CONFIG")
          elif find extracted -name package.json | grep -q .; then
            PROJECT_DIR=$(dirname "$(find extracted -name package.json | head -1)")
          else
            echo "ERROR: No project configuration found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found: $PROJECT_DIR"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm run build --if-present

      - name: Generate Android Project
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap add android
          else
            npm install @capacitor/android
          fi

          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: "extracted/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
          
          
          
          
          
          
          
