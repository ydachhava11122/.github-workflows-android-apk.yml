
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          test -n "$ZIP" || { echo "ZIP not found"; exit 1; }
          unzip -q "$ZIP" -d extracted

          PACKAGE=$(find extracted -name package.json -not -path "*/node_modules/*" | head -n 1)
          test -n "$PACKAGE" || { echo "package.json not found"; exit 1; }

          echo "PROJECT_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps
          npm install react-is --save --legacy-peer-deps

      - name: Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Configure Capacitor
        run: |
          cd "$PROJECT_DIR"
          npm install @capacitor/core @capacitor/cli @capacitor/android --save --legacy-peer-deps

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.js ]; then
            npx cap init AAKNOVA com.aaknova.app --web-dir=dist
          fi

          npx cap add android

          npx cap sync android

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR/android"
          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper missing"
            ls -la
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
          
          
          
          
