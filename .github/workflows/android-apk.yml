
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept licenses and install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP nahi mili."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate project folder
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name "capacitor.config.json" -o -name "capacitor.config.ts" -o -name "capacitor.config.js" \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name "package.json" -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json ya Capacitor config nahi mili."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found: $PROJECT_DIR"

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm pkg set 'devDependencies.esbuild=^0.28.2'
          npm install --legacy-peer-deps

      - name: Build web app
        run: |
          cd "$PROJECT_DIR"
          npm run build --if-present

      - name: Setup Capacitor Android
        run: |
          cd "$PROJECT_DIR"
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.js ]; then
            npx cap init AAKNOVA com.aaknova.app --web-dir=dist
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Prepare Gradle
        run: |
          cd "$PROJECT_DIR/android"

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.13
          fi

          chmod +x gradlew

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
          
          
          
          
          
          
          
          
