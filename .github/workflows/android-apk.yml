
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Android SDK Environment
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Project
        run: |
          CONFIG=$(find extracted -type f \( \
            -name capacitor.config.json -o \
            -name capacitor.config.ts -o \
            -name capacitor.config.js \
            \) | head -1)

          if [ -n "$CONFIG" ]; then
            PROJECT_DIR=$(dirname "$CONFIG")
          else
            PACKAGE=$(find extracted -type f -name package.json | head -1)
            if [ -z "$PACKAGE" ]; then
              echo "ERROR: package.json not found"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$PACKAGE")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm run build --if-present

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap add android
          else
            npm install @capacitor/android
          fi

          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper missing from Android project"
            exit 1
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: "extracted/**/android/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
          
          
          
          
          
          
          
