name: Build AAKNOVA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm install --no-save --no-audit --no-fund --ignore-scripts \
            @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0

      - name: Point app API calls to backend (optional)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            sed -i "s#const res = await fetch(url, {#const res = await fetch((import.meta.env.VITE_API_BASE_URL || '') + url, {#" src/lib/api.ts
            grep -q "VITE_API_BASE_URL" src/lib/api.ts
            echo "VITE_API_BASE_URL=${API_BASE_URL%/}" >> "$GITHUB_ENV"
          else
            echo "API_BASE_URL not set - app relative /api paths use karega."
          fi

      - name: Build web bundle
        run: npm run build

      - name: Prepare Capacitor config
        run: |
          npx tsx -e "import c from './capacitor.config.ts'; import fs from 'node:fs'; fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));"
          rm -f capacitor.config.ts
          test -f dist/index.html

      - name: Sync web bundle into Android project
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.AAKNOVA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.AAKNOVA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.AAKNOVA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AAKNOVA_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > app/release.jks
            : "${KEY_PASS:=$KS_PASS}"
            echo "Using repository keystore."
          else
            KS_PASS="$(openssl rand -hex 16)"
            KEY_PASS="$KS_PASS"
            KS_ALIAS="aaknova-ci"
            keytool -genkeypair -keystore app/release.jks -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=AAKNOVA, OU=CI, O=AAKNOVA, C=IN"
            echo "No keystore secrets found - temporary CI keystore generated."
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: aaknova-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: AAKNOVA APK build ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          prerelease: true
          
          
          
          
          
          
          
          
          
          
          
          
          
