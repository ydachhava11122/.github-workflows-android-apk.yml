
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build AAKNOVA Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract AAKNOVA project
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p extracted

          mapfile -t ROOT_ZIPS < <(
            find . -maxdepth 3 -type f -iname '*.zip' \
              ! -path './.git/*' \
              ! -path './extracted/*' | sort
          )

          if [ "${#ROOT_ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one project ZIP."
            printf '%s\n' "${ROOT_ZIPS[@]}"
            exit 1
          fi

          unzip -oq "${ROOT_ZIPS[0]}" -d extracted

          PROJECT_DIR=""

          for depth in 1 2 3; do
            mapfile -t PROJECTS < <(
              find extracted -type f -name package.json \
                ! -path '*/node_modules/*' \
                ! -path '*/android/*' | sort
            )

            if [ "${#PROJECTS[@]}" -eq 1 ]; then
              PROJECT_DIR="$(dirname "${PROJECTS[0]}")"
              break
            elif [ "${#PROJECTS[@]}" -gt 1 ]; then
              echo "ERROR: Multiple projects found."
              printf '%s\n' "${PROJECTS[@]}"
              exit 1
            fi

            mapfile -t NESTED_ZIPS < <(
              find extracted -type f -iname '*.zip' \
                ! -path '*/node_modules/*' | sort
            )

            if [ "${#NESTED_ZIPS[@]}" -eq 0 ]; then
              echo "ERROR: Project ZIP not found."
              exit 1
            fi

            for archive in "${NESTED_ZIPS[@]}"; do
              destination="extracted/unpacked-${depth}-$(basename "${archive%.zip}")"
              mkdir -p "$destination"
              unzip -oq "$archive" -d "$destination"
            done
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Install Node dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          npm install --no-audit --no-fund --legacy-peer-deps

          npm install --save-exact --legacy-peer-deps \
            @capacitor/core@6.2.1 \
            @capacitor/cli@6.2.1 \
            @capacitor/android@6.2.1

          npm install --save-dev --save-exact --legacy-peer-deps \
            typescript@5.7.3

          npm install --save --legacy-peer-deps react-is

      - name: Verify project configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          test -f package.json
          test -f index.html
          test -f vite.config.ts

          node -e "
            const p = require('./package.json');
            if (!p.scripts || !p.scripts.build) {
              throw new Error('Missing npm build script');
            }
            console.log('Package configuration verified');
          "

      - name: Configure Capacitor
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [ -f capacitor.config.ts ]; then
            mv capacitor.config.ts capacitor.config.ts.backup
          fi

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.aaknova.enterprise",
            "appName": "AAKNOVA",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "backgroundColor": "#060E1D",
              "allowMixedContent": false
            }
          }
          JSON

          npx cap --version
          npx cap config

      - name: Build web application
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          npm run build

          test -d dist
          test -f dist/index.html

      - name: Generate Android project
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          # Keep existing Android resources before regeneration.
          if [ -d android/app/src/main/res ]; then
            mkdir -p /tmp/aaknova-res
            cp -a android/app/src/main/res/. /tmp/aaknova-res/
          fi

          rm -rf android

          npx cap add android

          if [ -d /tmp/aaknova-res ]; then
            cp -a /tmp/aaknova-res/. android/app/src/main/res/
          fi

          npx cap sync android

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar

          chmod +x android/gradlew

      - name: Configure Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0'

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"

          java -version
          ./gradlew --version

      - name: Verify Android configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"

          test -f settings.gradle
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Android configuration files verified."

      - name: Build Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"

          ./gradlew --no-daemon --stacktrace clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/AAKNOVA.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$GITHUB_WORKSPACE/output/AAKNOVA.apk"

          test -s "$APK"
          file "$APK"
          sha256sum "$APK"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify --verbose "$APK"

      - name: Upload AAKNOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: output/AAKNOVA.apk
          if-no-files-found: error
          retention-days: 14
          











          
